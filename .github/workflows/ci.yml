name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows because that's where the data is edited; Ubuntu because
    # that's what Colab/Kaggle run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest
      - name: Build the real database from data/raw
        run: sofara-build
